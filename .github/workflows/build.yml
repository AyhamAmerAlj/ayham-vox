name: Build AYHAM VOX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cairo font (SIL OFL)
        run: |
          mkdir -p shared-core/src/main/res/font
          curl -fsSL -o shared-core/src/main/res/font/cairo.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          test "$(stat -c%s shared-core/src/main/res/font/cairo.ttf)" -gt 100000

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :shared-core:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon -PvoxBuild=${{ github.run_number }} :android-phone:assembleDebug :android-tv:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android-phone/build/outputs/apk/debug/android-phone-debug.apk dist/ayham-vox-phone.apk
          cp android-tv/build/outputs/apk/debug/android-tv-debug.apk dist/ayham-vox-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ayham-vox-apks
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: shared-core/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish release (used by in-app updater)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/ayham-vox-phone.apk dist/ayham-vox-tv.apk \
            --title "AYHAM VOX build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }} (${{ github.sha }})" \
            --latest
