name: Build AYHAM VOX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :shared-core:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon :android-phone:assembleDebug :android-tv:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ayham-vox-phone-debug
          path: android-phone/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ayham-vox-tv-debug
          path: android-tv/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: shared-core/build/reports/tests/
